apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: oficina-env
  labels:
    app.kubernetes.io/name: prisma-migrate
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: techchallenge

spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/name: prisma-migrate
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: techchallenge
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      containers:
        - name: prisma-migrate
          image: 982623100545.dkr.ecr.us-east-1.amazonaws.com/oficina-api:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - prisma:migrate:deploy

          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
