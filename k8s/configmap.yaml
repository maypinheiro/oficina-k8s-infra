apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  namespace: oficina-env
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: techchallenge
data:
  NODE_ENV: production
  PORT: "3000"
  CORS_ORIGIN: "CORS_ORIGIN"
  JWT_ISSUER: oficina-auth
  JWT_AUDIENCE: oficina-api
  SAGA_ENABLED: "SAGA_ENABLED"
  OS_EVENTS_QUEUE_URL: "OS_EVENTS_QUEUE_URL"
  BILLING_COMMAND_QUEUE_URL: "BILLING_COMMAND_QUEUE_URL"
  EXECUTION_COMMAND_QUEUE_URL: "EXECUTION_COMMAND_QUEUE_URL"
